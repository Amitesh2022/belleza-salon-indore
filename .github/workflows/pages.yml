name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build static site
        run: |
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            export NEXT_PUBLIC_BASE_PATH=""
            export NEXT_PUBLIC_SITE_URL="https://${{ vars.CUSTOM_DOMAIN }}"
          else
            export NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}"
            export NEXT_PUBLIC_SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          npm run build:static
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
